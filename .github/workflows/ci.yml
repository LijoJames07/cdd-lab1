name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Display the text file
        run: cat message.txt

      - name: Check expected content
        run: grep "Hello from CI/CD lab" message.txt